<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Leaderboards</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../shared/styles.css" />
	<script src="../shared/auth.js"></script>
	<style>
		body.leaderboard {
			background-color: #090c12;
			background-image:
				radial-gradient(1200px 800px at 50% -10%, rgba(124,92,255,0.12), transparent 60%),
				radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.8), transparent),
				radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,0.7), transparent),
				radial-gradient(1.2px 1.2px at 40% 60%, rgba(255,255,255,0.6), transparent),
				radial-gradient(1.2px 1.2px at 85% 65%, rgba(255,255,255,0.6), transparent),
				radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.5), transparent),
				radial-gradient(1px 1px at 55% 50%, rgba(255,255,255,0.5), transparent),
				linear-gradient(180deg, #090c12 0%, #0b0f14 100%);
			background-repeat: no-repeat;
			background-attachment: fixed;
		}
		.name-cell { display: flex; align-items: center; gap: 10px; }
		.avatar-small { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: linear-gradient(135deg, #2a0f4d, #4a1c7a); box-shadow: 0 6px 14px rgba(124,92,255,0.25); color: var(--text); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; }
		.avatar-small img { width: 100%; height: 100%; object-fit: cover; display: block; }
		.table td, .table th { vertical-align: middle; }
		.rank-cell { text-align: center; width: 64px; }
		/* Center rank content perfectly */
		.table td.rank-cell { display: flex; align-items: center; justify-content: center; }
		.rank { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
		.rank.medal { font-size: 24px; }
		.rank.num { font-size: 16px; font-weight: 700; }
	</style>
</head>
<body class="leaderboard">
	<nav class="nav">
		<div class="nav-inner container">
			<div class="brand"><div class="brand-badge"></div> Defend X</div>
			<div class="nav-links">
				<a class="nav-link" href="../metamask/index.html">Home</a>
				<a class="nav-link" href="../leaderboard/index.html">Leaderboard</a>
				<a class="nav-link" href="../upload-bounty/index.html" data-hide-specialist>Upload Bounty</a>
				<a class="nav-link" href="../bounties/index.html" data-hide-company>Bounties</a>
				<a class="nav-link" href="../wallet/index.html">Wallet</a>
				<a class="nav-link" href="../profile/index.html">Profile</a>
				<a class="btn" href="../hunt/index.html" data-hide-company>Start Hunting</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<div class="hero" style="padding-bottom: 0;">
			<h1>Leaderboards</h1>
			<p style="color:var(--muted);">Ranked by points</p>
		</div>
		<div class="card">
			<table class="table" id="lb">
				<thead>
					<tr><th class="rank-cell">Rank</th><th>Hunter</th><th>Points</th></tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</div>

	<div class="footer">© <span id="year"></span> Defend X</div>
	<script src="../shared/storage.js"></script>
	<script src="./script.js"></script>
</body>
</html>
